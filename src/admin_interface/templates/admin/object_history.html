{% extends "admin/object_history.html" %}
{% load i18n admin_urls %}

{% block content %}
{% if object %}
{% url opts|admin_urlname:'change' object.pk|admin_urlquote as back_url %}
<ul class="object-tools" id="object-history-back-tools">
    <li>
        <a href="{% add_preserved_filters back_url %}" class="historylink">{% trans "Back" %}</a>
    </li>
</ul>
{% endif %}
{{ block.super }}
{% endblock %}
