<p class="datetime">
  <span class="datetime-row"><span class="datetime-sublabel">{{ date_label }}</span>{% with widget=widget.subwidgets.0 %}{% include widget.template_name %}{% endwith %}</span>
  <span class="datetime-row"><span class="datetime-sublabel">{{ time_label }}</span>{% with widget=widget.subwidgets.1 %}{% include widget.template_name %}{% endwith %}</span>
</p>
