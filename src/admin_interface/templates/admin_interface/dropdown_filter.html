{% load admin_interface_tags i18n %}

<div class="list-filter-dropdown">
    <h3 {% if spec.lookup_val or spec.value %}class="active"{% endif %}>{% blocktranslate with filter_title=title %} By {{ filter_title }} {% endblocktranslate %}</h3>
    <div>
        <select>
        {% for choice in choices %}
            <option {% if choice.selected %}selected{% endif %} value="{{ choice.query_string|iriencode }}">{{ choice.display }}</option>
        {% endfor %}
        </select>
    </div>
</div>

{% comment %}
dropdown-filter.js is loaded once per page in change_list.html's filters
block, not here -- this template is included once PER FILTER, so a
<script> tag here would be embedded (and executed) once per filter too.
{% endcomment %}
