<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site_title }} | {{ error_code }} {{ error_title }}</title>
    <style>
        :root {
            --ep-header-bg:   {{ theme.css_header_background_color }};
            --ep-title-color: {{ theme.title_color }};
            --ep-body-bg:     {{ theme.css_module_background_color }};
            --ep-text:        {{ theme.css_module_text_color }};
            --ep-btn-bg:      {{ theme.css_save_button_background_color }};
            --ep-btn-hover:   {{ theme.css_save_button_background_hover_color }};
            --ep-btn-text:    {{ theme.css_save_button_text_color }};
            --ep-radius:      {{ theme.css_module_border_radius }};
{% if title_font_size %}
            --ep-title-font-size: {{ title_font_size }};
{% endif %}
{% if theme.css_body_font_family %}
            --ep-font-family: {{ theme.css_body_font_family }};
{% endif %}
{% if theme.css_body_font_size %}
            --ep-font-size: {{ theme.css_body_font_size }};
{% endif %}
        }
        @media (prefers-color-scheme: dark) {
            :root {
{% if theme.css_header_background_color_dark_use and theme.css_header_background_color_dark %}
                --ep-header-bg: {{ theme.css_header_background_color_dark }};
{% endif %}
{% if theme.title_color_dark_use and theme.title_color_dark %}
                --ep-title-color: {{ theme.title_color_dark }};
{% endif %}
{% if theme.css_module_background_color_dark_use and theme.css_module_background_color_dark %}
                --ep-body-bg: {{ theme.css_module_background_color_dark }};
{% endif %}
{% if theme.css_module_text_color_dark_use and theme.css_module_text_color_dark %}
                --ep-text: {{ theme.css_module_text_color_dark }};
{% endif %}
{% if theme.css_save_button_background_color_dark_use and theme.css_save_button_background_color_dark %}
                --ep-btn-bg: {{ theme.css_save_button_background_color_dark }};
{% endif %}
{% if theme.css_save_button_background_hover_color_dark_use and theme.css_save_button_background_hover_color_dark %}
                --ep-btn-hover: {{ theme.css_save_button_background_hover_color_dark }};
{% endif %}
{% if theme.css_save_button_text_color_dark_use and theme.css_save_button_text_color_dark %}
                --ep-btn-text: {{ theme.css_save_button_text_color_dark }};
{% endif %}
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--ep-font-family, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji");
            font-size: var(--ep-font-size, 14px);
            line-height: 1.5;
            background-color: var(--ep-body-bg);
            color: var(--ep-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header — matches Django admin #header structure */
        #header {
            background-color: var(--ep-header-bg);
            height: auto;
            padding: 10px 40px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        #branding {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            overflow: hidden;
        }

        #branding img {
            max-width: {{ logo_max_width }}px;
            max-height: {{ logo_max_height }}px;
            width: auto;
            height: auto;
            display: block;
            transform: translateY(calc(-1px * {{ logo_vertical_offset }}));
        }

        #branding .site-name {
            color: var(--ep-title-color);
            font-size: var(--ep-title-font-size, 1.5rem);
            font-weight: 300;
            white-space: nowrap;
        }

        /* Error content */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 24px;
        }

        .error-content {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        .error-code {
            font-size: 80px;
            font-weight: 700;
            line-height: 1;
            color: var(--ep-btn-bg);
            margin-bottom: 16px;
            letter-spacing: -2px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--ep-text);
        }

        .error-message {
            opacity: 0.7;
            margin-bottom: 36px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;
            background-color: var(--ep-btn-bg);
            color: var(--ep-btn-text);
            text-decoration: none;
            padding: 9px 22px;
            border-radius: var(--ep-radius, 4px);
            font-size: 13px;
            font-weight: 500;
        }

        .back-link:hover {
            background-color: var(--ep-btn-hover);
            color: var(--ep-btn-text);
        }
    </style>
</head>
<body>
    <div id="header">
        <a id="branding" href="/">
            {% if logo_url and logo_visible %}<img src="{{ logo_url }}" alt="">{% endif %}
            <span class="site-name">{{ site_title }}</span>
        </a>
    </div>
    <main>
        <div class="error-content">
            <div class="error-code">{{ error_code }}</div>
            <h1>{{ error_title }}</h1>
            <p class="error-message">{{ error_message }}</p>
            <a href="/" class="back-link">&#8592; Return to home</a>
        </div>
    </main>
</body>
</html>
