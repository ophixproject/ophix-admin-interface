[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ophix-admin-interface"
version = "2026.06.11.27"
description = "Ophix fork of django-admin-interface: theme management, extended CSS vars, namespaced media, bundled theme API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Ophix Project" }
]
keywords = ["django", "admin", "theme", "ophix"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "Django>=4.2",
    "django-colorfield>=0.11",
    "python-slugify>=8.0",
]

[project.urls]
Homepage = "https://ophix.io"
Documentation = "https://github.com/ophixproject/ophix-admin-interface#readme"
Source = "https://github.com/ophixproject/ophix-admin-interface"

[project.entry-points."ophix.plugins"]
ophix_admin_interface = "admin_interface"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"admin_interface" = [
    "OPHIX_RELEASE_NOTES.md",
    "templates/**/*.html",
    "static/**/*",
    "locale/**/*",
    "fixtures/**/*",
    "themes/**/*",
    "docs/**/*",
]
